services:
  postgres:
    image: postgres:15-alpine
    container_name: nakama-postgres
    environment:
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nakama
    restart: "no"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama"]
      interval: 10s
      timeout: 5s
      retries: 5

  nakama:
    image: heroiclabs/nakama:3.21.1
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address "postgresql://nakama:password@postgres:5432/nakama?sslmode=disable" &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address "postgresql://nakama:password@postgres:5432/nakama?sslmode=disable"
    restart: "no"
    links:
      - "postgres:db"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./local.yml:/nakama/data/local.yml
      - /tmp/main.so:/nakama/data/modules/main.so
    expose:
      - "7349"
      - "7350"
      - "7351"
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
